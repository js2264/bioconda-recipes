{% set name = "metacooler" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b0b165fe0cd3dd2b204dca17c9489e30c61f4a6069cdbb927190bd011eb736cf

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - metacooler = metacooler.cli.main:cli
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling >=1.27
  run:
    - python >=3.10
    - cooler >=0.10
    - h5py >=3.8
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.10
    - matplotlib-base >=3.7
    - pyarrow >=13
    - pyfaidx >=0.7.2.2
    - click >=8.1
    - rich >=13
    - rich-click >=1.9
    - pyyaml >=6.0

test:
  imports:
    - metacooler
  commands:
    - metacooler --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/js2264/metacooler
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Hi-C contact maps for metagenomes: an extension of the cooler format."
  description: |
    metacooler stores multi-genome (metagenomic) Hi-C contact maps as .metacool
    files: cooler files with an added genomes and contigs layer. Every
    .metacool file stays readable by cooler.
  dev_url: https://github.com/js2264/metacooler
  doc_url: https://js2264.github.io/metacooler

extra:
  recipe-maintainers:
    - js2264
