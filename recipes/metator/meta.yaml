{% set name = "metator" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c58e9fb55efb42c67eb68fde9b357171f1b3f7e049153256c142bdac33d63e72

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - metator = metator.cli:cli
  run_exports:
    - {{ pin_subpackage("metator", max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10
    - hicstuff >=3.3.0
    - metacooler >=0.2.0
    - python-igraph >=0.10.3
    - biopython >=1.80
    - pysam
    - pyfastx
    - numpy
    - pandas
    - scipy
    - matplotlib-base >=3.9
    - rich-click >=1.9
    - micomplete
    - pairix
    - bowtie2
    - bwa
    - samtools
    - prodigal
    - hmmer
    - coreutils

test:
  imports:
    - metator
  commands:
    - metator --help
    - pip check
  requires:
    - pip

about:
  home: "https://github.com/koszullab/metator"
  summary: "Metagenomic binning based on Hi-C data."
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  doc_url: "https://github.com/koszullab/metaTOR/blob/v{{ version }}/README.md"
  dev_url: "https://github.com/koszullab/metator"

extra:
  recipe-maintainers:
    - js2264
  identifiers:
    - doi:10.3389/fgene.2019.00753
